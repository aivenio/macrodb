name: Generate ER Diagram

on:
  push:
    branches:
      - master
    paths:
      - 'database/initialize.sql'
  pull_request:
    branches:
      - master
    paths:
      - 'database/initialize.sql'

jobs:
  generate-erd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydb
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply schema from initialize.sql
        run: |
          psql postgresql://postgres:postgres@localhost:5432/mydb \
            -f database/initialize.sql
        env:
          PGPASSWORD: postgres

      - name: Install tbls
        run: |
          curl -sSL https://github.com/k1LoW/tbls/releases/latest/download/tbls_linux_amd64.tar.gz \
            | tar xz tbls
          sudo mv tbls /usr/local/bin/tbls
          tbls version

      - name: Generate ER diagram (PNG)
        run: |
          mkdir -p docs/schema
          tbls doc \
            "postgres://postgres:postgres@localhost:5432/mydb?sslmode=disable" \
            docs/schema \
            --rm-dist \
            --without-er-dot
        env:
          TBLS_DSN: "postgres://postgres:postgres@localhost:5432/mydb?sslmode=disable"

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli
          mmdc --version

      - name: Extract Mermaid ERD and render PNG
        run: |
          python3 - <<'EOF'
          import re, pathlib

          readme = pathlib.Path("docs/schema/README.md").read_text()
          match = re.search(r"```mermaid\s*(erDiagram.*?)```", readme, re.DOTALL)
          if not match:
              raise SystemExit("No erDiagram block found in docs/schema/README.md")

          mmd = match.group(1).strip()
          pathlib.Path("/tmp/erd.mmd").write_text(mmd)
          print("Mermaid source written to /tmp/erd.mmd")
          EOF

          mmdc \
            -i /tmp/erd.mmd \
            -o docs/schema/erd.png \
            -t default \
            -b white \
            --width 1600

          echo "ER diagram saved to docs/schema/erd.png"

      # ── On push to master: commit the updated diagram back ──────────────────
      - name: Commit ER diagram to master
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate ER diagram [skip ci]"
          file_pattern: docs/schema/**
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # ── On PR: upload artifact + post sticky comment ─────────────────────────
      - name: Upload ER diagram artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: erd-diagram
          path: docs/schema/erd.png
          retention-days: 30

      - name: Post ER diagram as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: erd-diagram
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## 📊 ER Diagram — schema preview

            The `database/initialize.sql` file was modified in this PR.

            > _Download the full-resolution PNG from the [workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._

            _Generated by [tbls](https://github.com/k1LoW/tbls) + Mermaid CLI on run [`${{ github.run_id }}`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_
